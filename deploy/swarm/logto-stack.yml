services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7.12}
    command:
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=INFO
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.web.http.redirections.entrypoint.priority=1
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --entrypoints.adminsecure.address=:${LOGTO_ADMIN_PORT:-30443}
      - --entrypoints.adminsecure.http.aliasheadersstrategy=delete
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=logto-public
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: ${LOGTO_ADMIN_PORT:-30443}
        published: ${LOGTO_ADMIN_PORT:-30443}
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: volume
        source: acme-state
        target: /var/lib/lego
        read_only: true
      - type: volume
        source: traefik-dynamic
        target: /dynamic
        read_only: true
    networks:
      - public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == ${LOGTO_PLACEMENT_HOSTNAME}
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
        window: 2m
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  acme-web:
    image: nginx:1.29-alpine
    volumes:
      - type: volume
        source: acme-challenges
        target: /usr/share/nginx/html
        read_only: true
    networks:
      - public
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${LOGTO_PLACEMENT_HOSTNAME}
      labels:
        - traefik.enable=true
        - traefik.swarm.network=logto-public
        - traefik.http.routers.logto-acme.rule=PathPrefix(`/.well-known/acme-challenge/`)
        - traefik.http.routers.logto-acme.entrypoints=web
        - traefik.http.routers.logto-acme.priority=10000
        - traefik.http.routers.logto-acme.service=logto-acme
        - traefik.http.services.logto-acme.loadbalancer.server.port=80
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 64M

  acme-renewer:
    image: goacme/lego:v5.4.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /var/www/acme/.well-known/acme-challenge /var/lib/lego/certificates /dynamic
        while true; do
          /lego run \
            --accept-tos \
            --email "$${ACME_EMAIL}" \
            --domains "$${LOGTO_HOST}" \
            --http \
            --http.webroot /var/www/acme \
            --path /var/lib/lego \
            --profile shortlived \
            --renew-days 3 \
            --no-random-sleep
          config=/dynamic/tls.yml.tmp
          printf '%s\n' \
            'tls:' \
            '  stores:' \
            '    default:' \
            '      defaultCertificate:' \
            "        certFile: /var/lib/lego/certificates/$${LOGTO_HOST}.crt" \
            "        keyFile: /var/lib/lego/certificates/$${LOGTO_HOST}.key" \
            '  certificates:' \
            "    - certFile: /var/lib/lego/certificates/$${LOGTO_HOST}.crt" \
            "      keyFile: /var/lib/lego/certificates/$${LOGTO_HOST}.key" \
            > "$${config}"
          mv "$${config}" /dynamic/tls.yml
          sleep 12h
        done
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      LOGTO_HOST: ${LOGTO_HOST}
    volumes:
      - type: volume
        source: acme-state
        target: /var/lib/lego
      - type: volume
        source: acme-challenges
        target: /var/www/acme
      - type: volume
        source: traefik-dynamic
        target: /dynamic
    networks:
      - public
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /var/lib/lego/certificates/$${LOGTO_HOST}.crt -a -s /var/lib/lego/certificates/$${LOGTO_HOST}.key",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 3m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${LOGTO_PLACEMENT_HOSTNAME}
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 20
        window: 30m
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 128M

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logto
      POSTGRES_USER: logto
      POSTGRES_PASSWORD_FILE: /run/secrets/logto_postgres_password
    secrets:
      - logto_postgres_password
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=logto --dbname=logto"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${LOGTO_PLACEMENT_HOSTNAME}
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 20
        window: 5m
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1536M

  app:
    image: ${LOGTO_IMAGE}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        postgres_password="$$(cat /run/secrets/logto_postgres_password)"
        export DB_URL="postgres://logto:$${postgres_password}@postgres:5432/logto"
        export PROTECTED_APP_GATEWAY_SHARED_SECRET="$$(cat /run/secrets/logto_protected_app_gateway_shared_secret)"
        npm run cli db seed -- --swe
        exec npm start
    environment:
      TRUST_PROXY_HEADER: "1"
      ENDPOINT: https://${LOGTO_HOST}
      ADMIN_ENDPOINT: https://${LOGTO_ADMIN_HOST}:${LOGTO_ADMIN_PORT:-30443}
      SELF_HOSTED_PARITY_ENABLED: "true"
      SELF_HOSTED_DATA_PATH: /var/lib/logto
      PROTECTED_APP_GATEWAY_DOMAIN: ${PROTECTED_APP_GATEWAY_DOMAIN}
    secrets:
      - logto_postgres_password
      - logto_protected_app_gateway_shared_secret
    volumes:
      - type: volume
        source: logto-data
        target: /var/lib/logto
    networks:
      - public
      - backend
    healthcheck:
      test:
        ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3002/api/status"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 2m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${LOGTO_PLACEMENT_HOSTNAME}
      labels:
        - traefik.enable=true
        - traefik.swarm.network=logto-public
        - traefik.http.routers.logto.rule=Host(`${LOGTO_HOST}`)
        - traefik.http.routers.logto.entrypoints=websecure
        - traefik.http.routers.logto.tls=true
        - traefik.http.routers.logto.service=logto
        - traefik.http.services.logto.loadbalancer.server.port=3001
        - traefik.http.routers.logto-admin.rule=Host(`${LOGTO_ADMIN_HOST}`)
        - traefik.http.routers.logto-admin.entrypoints=adminsecure
        - traefik.http.routers.logto-admin.tls=true
        - traefik.http.routers.logto-admin.service=logto-admin
        - traefik.http.services.logto-admin.loadbalancer.server.port=3002
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 2m
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 20
        window: 10m
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 3G

networks:
  public:
    name: logto-public
    external: true
  backend:
    driver: overlay
    internal: true

volumes:
  logto-data:
  postgres-data:
  acme-state:
  acme-challenges:
  traefik-dynamic:

secrets:
  logto_postgres_password:
    external: true
  logto_protected_app_gateway_shared_secret:
    external: true
