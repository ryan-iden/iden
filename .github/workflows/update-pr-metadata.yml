name: Update Metadata

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Fork metadata uses the trusted base workflow, never PR code or downloaded scripts.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  update-metadata:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Update labels and assignee
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const issue = { ...context.repo, issue_number: pr.number };
            const type = /^(\w+)(?:\([^)]+\))?!?:/.exec(pr.title)?.[1];
            const label = { fix: 'bug', feat: 'enhancement', docs: 'documentation' }[type];
            if (label) {
              await github.rest.issues.addLabels({ ...issue, labels: [label] });
            }
            if (['opened', 'reopened'].includes(context.payload.action) && pr.user.type !== 'Bot') {
              await github.rest.issues.addAssignees({ ...issue, assignees: [pr.user.login] });
            }

  pr-size-diff:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on file sizes using GitHub tree metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${pr.base.sha}...${pr.head.sha}`,
            });
            const readSizes = async (sha) => {
              const { data } = await github.rest.git.getTree({
                ...context.repo, tree_sha: sha, recursive: 'true',
              });
              if (data.truncated) throw new Error('GitHub truncated the tree; refusing an incomplete size report.');
              return new Map(data.tree.filter(({ type }) => type === 'blob').map(({ path, size }) => [path, size ?? 0]));
            };
            const [base, head] = await Promise.all([
              readSizes(comparison.merge_base_commit.sha), readSizes(pr.head.sha),
            ]);
            const changes = [...new Set([...base.keys(), ...head.keys()])]
              .map((path) => ({ path, bytes: (head.get(path) ?? 0) - (base.get(path) ?? 0) }))
              .filter(({ bytes }) => bytes !== 0)
              .sort((a, b) => Math.abs(b.bytes) - Math.abs(a.bytes));
            const format = (bytes) => `${bytes > 0 ? '+' : ''}${bytes.toLocaleString('en-US')} bytes`;
            // Treat filenames and branch names as data, including Markdown/HTML metacharacters.
            const escape = (text) => text.replace(/[&<>|`\r\n]/g, (value) => `&#${value.charCodeAt(0)};`);
            const marker = '<!-- iden-pr-size-diff -->';
            const rows = changes.slice(0, 100).map(({ path, bytes }) => `| ${escape(path)} | ${format(bytes)} |`).join('\n');
            const body = `${marker}\n#### Compare to ${escape(pr.base.ref)} (merge base)\n` +
              `**Total size difference:** ${format(changes.reduce((total, { bytes }) => total + bytes, 0))}\n\n` +
              (rows ? `<details>\n<summary>File size changes (${changes.length}; largest 100 shown)</summary>\n\n| File | Difference |\n| --- | ---: |\n${rows}\n</details>` : 'No file size changes.');
            const issue = { ...context.repo, issue_number: pr.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find((comment) => comment.user.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
