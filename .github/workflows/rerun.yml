# From this genius: https://github.com/orgs/community/discussions/67654#discussioncomment-8038649
name: Rerun workflow

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the failed integration workflow run
        required: true
        type: string
permissions:
  actions: write
jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: rerun ${{ inputs.run_id }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid run ID" >&2; exit 1; }
          gh run watch "$RUN_ID" --interval 30 > /dev/null 2>&1
          gh run rerun "$RUN_ID" --failed
