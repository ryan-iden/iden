name: Self-hosted Swarm release

on:
  push:
    branches:
      - ryan-wong-coder-personal
  workflow_dispatch:

concurrency:
  group: self-hosted-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/logto-personal

jobs:
  validate:
    name: Validate self-hosted build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ^22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for component tests
        run: pnpm --filter @logto/elements exec playwright install --with-deps chromium

      - name: Build workspace packages
        run: pnpm prepack

      - name: Build self-hosted frontends
        run: pnpm --filter @logto/console --filter @logto/experience --filter @logto/account --filter @logto/demo-app --filter @logto/device-demo-app build

      - name: Verify self-hosted brand and local documentation output
        run: pnpm verify:self-hosted-brand

      - name: Check types
        run: pnpm -r check

      - name: Lint changed feature packages
        run: pnpm --filter @logto/shared --filter @logto/core --filter @logto/core-kit --filter @logto/console --filter @logto/experience --filter @logto/account --filter @logto/demo-app --filter @logto/device-demo-app --filter @logto/elements lint

      - name: Check frontend styles
        run: pnpm --filter @logto/core-kit --filter @logto/console --filter @logto/experience --filter @logto/account --filter @logto/demo-app --filter @logto/device-demo-app stylelint

      - name: Build Core test artifacts
        run: pnpm --filter @logto/core build:test

      - name: Test changed feature packages
        run: pnpm --filter @logto/shared --filter @logto/core --filter @logto/core-kit --filter @logto/console --filter @logto/experience --filter @logto/account --filter @logto/elements --filter @logto/help-center test:ci

      - name: Verify Cloud frontend build compatibility
        run: IS_CLOUD=1 pnpm --filter @logto/console --filter @logto/experience --filter @logto/account --filter @logto/demo-app --filter @logto/device-demo-app build

  publish-image:
    name: Publish immutable GHCR image
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve immutable image name
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:personal
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            self_hosted_parity_enabled=true
          cache-from: type=gha,scope=logto-self-hosted
          cache-to: type=gha,mode=max,scope=logto-self-hosted

  deploy-swarm:
    name: Deploy to production Swarm
    needs: publish-image
    environment: self-hosted-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      SWARM_MANAGER_HOST: ${{ vars.SWARM_MANAGER_HOST }}
      SWARM_DEPLOY_USER: ${{ vars.SWARM_DEPLOY_USER || 'logto-deploy' }}
      STACK_NAME: ${{ vars.SWARM_STACK_NAME || 'logto' }}
      LOGTO_HOST: ${{ vars.LOGTO_HOST }}
      LOGTO_ADMIN_HOST: ${{ vars.LOGTO_ADMIN_HOST }}
      LOGTO_ADMIN_PORT: ${{ vars.LOGTO_ADMIN_PORT || '30443' }}
      LOGTO_PLACEMENT_HOSTNAME: ${{ vars.LOGTO_PLACEMENT_HOSTNAME }}
      TRAEFIK_VERSION: ${{ vars.TRAEFIK_VERSION || 'v3.7.12' }}
      PROTECTED_APP_GATEWAY_DOMAIN: ${{ vars.PROTECTED_APP_GATEWAY_DOMAIN }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment configuration
        env:
          SWARM_SSH_PRIVATE_KEY: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}
          SWARM_KNOWN_HOSTS: ${{ secrets.SWARM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SWARM_MANAGER_HOST:?Set SWARM_MANAGER_HOST in the production environment}"
          : "${SWARM_DEPLOY_USER:?Set SWARM_DEPLOY_USER in the production environment}"
          : "${LOGTO_HOST:?Set LOGTO_HOST in the production environment}"
          : "${LOGTO_ADMIN_HOST:?Set LOGTO_ADMIN_HOST in the production environment}"
          : "${LOGTO_ADMIN_PORT:?Set LOGTO_ADMIN_PORT in the production environment}"
          : "${LOGTO_PLACEMENT_HOSTNAME:?Set LOGTO_PLACEMENT_HOSTNAME in the production environment}"
          : "${PROTECTED_APP_GATEWAY_DOMAIN:?Set PROTECTED_APP_GATEWAY_DOMAIN in the production environment}"
          : "${ACME_EMAIL:?Set ACME_EMAIL in the production environment}"
          : "${SWARM_SSH_PRIVATE_KEY:?Set SWARM_SSH_PRIVATE_KEY in the production environment}"
          : "${SWARM_KNOWN_HOSTS:?Set SWARM_KNOWN_HOSTS in the production environment}"

      - name: Configure deployment SSH identity
        env:
          SWARM_SSH_PRIVATE_KEY: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}
          SWARM_KNOWN_HOSTS: ${{ secrets.SWARM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ssh_dir="${RUNNER_TEMP}/swarm-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$SWARM_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$SWARM_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          echo "SWARM_SSH_KEY=${ssh_dir}/id_ed25519" >> "$GITHUB_ENV"
          echo "SWARM_KNOWN_HOSTS_FILE=${ssh_dir}/known_hosts" >> "$GITHUB_ENV"

      - name: Validate Swarm stack
        env:
          LOGTO_IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          set -euo pipefail
          docker stack config \
            --compose-file deploy/swarm/logto-stack.yml \
            > /dev/null

      - name: Upload deployment files
        run: |
          set -euo pipefail
          target="${SWARM_DEPLOY_USER}@${SWARM_MANAGER_HOST}"
          ssh_args=(
            -i "$SWARM_SSH_KEY"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${SWARM_KNOWN_HOSTS_FILE}"
          )
          ssh "${ssh_args[@]}" "$target" 'install -d -m 0750 "$HOME/releases"'
          scp "${ssh_args[@]}" \
            deploy/swarm/logto-stack.yml \
            deploy/swarm/deploy.sh \
            "$target:releases/"

      - name: Deploy immutable image
        env:
          GHCR_TOKEN: ${{ github.token }}
          LOGTO_IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          set -euo pipefail
          target="${SWARM_DEPLOY_USER}@${SWARM_MANAGER_HOST}"
          ssh_args=(
            -i "$SWARM_SSH_KEY"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${SWARM_KNOWN_HOSTS_FILE}"
          )
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_args[@]}" "$target" \
            "docker login '${REGISTRY}' --username '${GITHUB_ACTOR}' --password-stdin"
          ssh "${ssh_args[@]}" "$target" \
            "LOGTO_IMAGE='${LOGTO_IMAGE}' TRAEFIK_VERSION='${TRAEFIK_VERSION}' LOGTO_HOST='${LOGTO_HOST}' LOGTO_ADMIN_HOST='${LOGTO_ADMIN_HOST}' LOGTO_ADMIN_PORT='${LOGTO_ADMIN_PORT}' LOGTO_PLACEMENT_HOSTNAME='${LOGTO_PLACEMENT_HOSTNAME}' PROTECTED_APP_GATEWAY_DOMAIN='${PROTECTED_APP_GATEWAY_DOMAIN}' ACME_EMAIL='${ACME_EMAIL}' bash releases/deploy.sh releases/logto-stack.yml '${STACK_NAME}' '${LOGTO_IMAGE}'"

      - name: Verify public endpoints
        run: |
          set -euo pipefail
          for endpoint in \
            "https://${LOGTO_HOST}/api/status" \
            "https://${LOGTO_HOST}/help/en/" \
            "https://${LOGTO_ADMIN_HOST}:${LOGTO_ADMIN_PORT}/api/status" \
            "https://${LOGTO_ADMIN_HOST}:${LOGTO_ADMIN_PORT}/help/en/"
          do
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 18 \
              --retry-delay 5 \
              --retry-all-errors \
              --output /dev/null \
              "$endpoint"
          done
